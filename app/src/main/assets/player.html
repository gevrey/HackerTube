<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>HackerTube player</title>
  <style>
    html,body,#video { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #video { border:0; }
  </style>
</head>
<body>
  <div id="video"></div>
  <script>
    'use strict';
    let player, ready = false, error = null;
    // Use only the documented iframe API. YouTube retains its branding and ads.
    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('video', {
        host: 'https://www.youtube-nocookie.com',
        videoId: 'VIDEO_ID_PLACEHOLDER',
        // The Android activity owns remote input, so the iframe needs no on-screen controls.
        playerVars: { autoplay:1, controls:0, disablekb:1, playsinline:1, rel:0, fs:0, origin:location.origin },
        events: {
          onReady: () => { ready = true; player.playVideo(); },
          onError: event => { error = event.data; }
        }
      });
    };
    window.tvPlayer = {
      command(action) {
        if (!ready) return;
        if (action === 'play') player.playVideo();
        else if (action === 'pause') player.pauseVideo();
        else if (action === 'toggle') {
          if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
          else player.playVideo();
        } else if (action === 'forward' || action === 'rewind') {
          player.seekTo(Math.max(0, player.getCurrentTime() + (action === 'forward' ? 10 : -10)), true);
        }
      },
      // Read-only diagnostics are useful during the physical-device smoke test.
      get state() { return { ready, status:ready ? player.getPlayerState() : null,
        time:ready ? player.getCurrentTime() : 0, error }; }
    };
    const script = document.createElement('script');
    script.src = 'https://www.youtube.com/iframe_api';
    script.onerror = () => { error = 'api'; };
    document.head.appendChild(script);
  </script>
</body>
</html>
